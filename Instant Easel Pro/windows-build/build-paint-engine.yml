name: Build InstantEasel.exe (Windows)
on:
  push:
    paths: ["tools/art/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/art
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm PaintEngine.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PaintEngine-windows
          path: tools/art/dist/InstantEasel.exe
