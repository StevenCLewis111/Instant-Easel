name: Build InstantEaselPro.exe (Windows)
# Builds Instant Easel Pro into one Windows program on a GitHub Windows machine, then saves it to
# "Instant Easel Pro/EXE Build/InstantEaselPro.exe" on the same branch (and as a download on the run's page).
# Runs on every push that changes Instant Easel Pro, or by hand: Actions tab > this workflow > Run workflow.
on:
  push:
    paths: ["Instant Easel Pro/**", "!Instant Easel Pro/EXE Build/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Instant Easel Pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --distpath "EXE Build" PaintEngine.spec
      - uses: actions/upload-artifact@v4
        with:
          name: InstantEaselPro-windows
          path: Instant Easel Pro/EXE Build/InstantEaselPro.exe
      - name: Save the new InstantEaselPro.exe to the branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "EXE Build/InstantEaselPro.exe"
          if git diff --cached --quiet; then echo "exe unchanged"; exit 0; fi
          git commit -m "Build InstantEaselPro.exe (Windows) from ${GITHUB_SHA::7}"
          git reset -q --hard HEAD && git clean -fdq          # drop PyInstaller's working files (build/), keep only the new exe
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
